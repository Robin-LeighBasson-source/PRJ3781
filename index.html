
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/morrow-mark.svg" />
    <meta
      name="description"
      content="Morrow is a student and graduate opportunity platform concept. Find what comes next."
    />
    <title>Morrow — Find what comes next</title>

    <style>
      #initial-loading-overlay {
        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
      }

      .initial-loading-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        color: #52796f;
        font-family: Arial, sans-serif;
      }

      .initial-loading-spinner {
        width: 52px;
        height: 52px;
        border: 5px solid #e5e7eb;
        border-top-color: #52796f;
        border-radius: 50%;
        animation: initial-loading-spin 0.8s linear infinite;
      }

      .initial-loading-content p {
        margin: 0;
        font-size: 15px;
        font-weight: 600;
      }

      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="initial-loading-overlay" role="status" aria-live="polite">
      <div class="initial-loading-content">
        <div class="initial-loading-spinner" aria-hidden="true"></div>
        <p>Loading Morrow...</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
