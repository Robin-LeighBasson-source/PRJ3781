server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin /api, matching the Vite dev proxy, so the frontend never needs
    # to know whether it is talking to a container or a local `npm run dev:api`.
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # React Router owns the route table: any path that is not a real file has to
    # return index.html rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
