name: morrow-prod

# Production stack for a VPS:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Caddy terminates TLS, serves the built frontend, and proxies /api. It is the
# only service exposed to the internet; the API is reachable only on the compose
# network. There is no nginx in this stack.

services:
  api:
    image: morrow-api:prod
    # These images are built on this machine, never pulled from a registry.
    pull_policy: build
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '8787'
      MONGODB_URI: ${MONGODB_URI:?set MONGODB_URI in .env before starting the stack}
      MORROW_DB_PATH: /app/server/data/morrow.db
      MORROW_CACHE_DIR: /app/server/.cache/http
      # Same-origin requests through Caddy carry this Origin on writes. Defaults
      # to https://DOMAIN; override in .env only to add extra origins (e.g. www).
      MORROW_CORS_ORIGINS: ${MORROW_CORS_ORIGINS:-https://${DOMAIN:?set DOMAIN in .env before starting the stack}}
      MORROW_SESSION_TTL_HOURS: ${MORROW_SESSION_TTL_HOURS:-8}
      MORROW_LOGIN_WINDOW_MINUTES: ${MORROW_LOGIN_WINDOW_MINUTES:-15}
      MORROW_LOGIN_MAX_ATTEMPTS: ${MORROW_LOGIN_MAX_ATTEMPTS:-8}
      # No background crawl during a demo; run one explicitly if needed.
      MORROW_CRAWL_SCHEDULE_ENABLED: ${MORROW_CRAWL_SCHEDULE_ENABLED:-0}
      MORROW_USER_AGENT: ${MORROW_USER_AGENT:-}
      MICROSOFT_LEARN_ENABLED: ${MICROSOFT_LEARN_ENABLED:-1}
      COURSERA_ENABLED: ${COURSERA_ENABLED:-1}
      COURSERA_USE_CATALOG_API: ${COURSERA_USE_CATALOG_API:-1}
    volumes:
      - api-data:/app/server/data
      - api-cache:/app/server/.cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  caddy:
    image: morrow-caddy:prod
    pull_policy: build
    build:
      context: .
      target: caddy
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env before starting the stack}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env before starting the stack}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
  api-cache:
  caddy-data:
  caddy-config:
